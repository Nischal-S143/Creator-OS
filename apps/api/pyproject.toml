[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "creatoros-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "sqlalchemy>=2.0",
    "alembic",
    "psycopg[binary]",
    "pydantic-settings",
    "google-genai",
    "httpx",
    "celery[redis]",
    "pyjwt[crypto]",
    "langgraph",
    "langgraph-checkpoint-postgres",
    "pymupdf",
    "python-multipart",
]

[project.optional-dependencies]
dev = ["pytest", "detect-secrets", "python-dotenv", "ruff", "bandit", "pip-audit"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
"alembic/*" = ["S608"]
